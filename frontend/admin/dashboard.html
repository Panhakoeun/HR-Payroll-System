<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Dashboard - HRPayroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 32px; flex-wrap: wrap; gap: 16px;
    }
    .header-left h1 { font-size: 32px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .header-left p { color: #64748b; font-size: 14px; }
    .user-info-header { display: flex; align-items: center; gap: 16px; }
    .user-badge {
      background: #dbeafe; color: #1d4ed8; font-size: 12px; font-weight: 600;
      padding: 6px 12px; border-radius: 6px; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .logout-btn {
      padding: 10px 20px; background: #ef4444; color: white; border: none;
      border-radius: 6px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit;
      transition: background 0.2s;
    }
    .logout-btn:hover { background: #dc2626; }
    .dashboard-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px; margin-bottom: 32px;
    }
    .summary-card {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06); cursor: pointer; transition: all 0.3s ease;
    }
    .summary-card:hover {
      transform: translateY(-4px); box-shadow: 0 8px 16px rgba(0, 0, 0, 0.12); border-color: #2563eb;
    }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px; }
    .card-header h3 {
      font-size: 14px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px;
    }
    .card-icon { font-size: 24px; }
    .card-value { font-size: 36px; font-weight: 700; color: #0f172a; margin-bottom: 12px; }
    .card-footer { font-size: 13px; color: #94a3b8; margin-top: 8px; font-style: italic; }
  </style>
</head>
<body data-role="admin">
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1>Admin Dashboard</h1>
        <p>Welcome back! Here's your company overview.</p>
      </div>
      <div class="user-info-header">
        <div style="text-align: right;">
          <div style="font-weight: 600; color: #0f172a;" id="userName">-</div>
          <div class="user-badge" id="userRole" style="display: inline-block; margin-top: 4px;">-</div>
        </div>
        <button class="logout-btn" id="logoutButton" type="button">Sign Out</button>
      </div>
    </div>

    <div id="dashboardContent">
      <p style="text-align: center; color: #64748b;">Loading dashboard...</p>
    </div>
  </div>

  <script src="/js/dashboard.js"></script>
</body>
</html>
