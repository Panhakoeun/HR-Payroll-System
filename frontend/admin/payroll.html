<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payroll - Admin - HRPayroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 16px;
    }
    .header-left h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .header-left p { color: #64748b; font-size: 14px; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e8f0;
      background: white; cursor: pointer; font-weight: 600; font-family: inherit;
    }
    .btn-primary { background: #2563eb; border-color: #2563eb; color: white; }
    .btn-danger { background: #ef4444; border-color: #ef4444; color: white; }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .card {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 16px;
    }
    .card h2 { font-size: 16px; margin-bottom: 12px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    label { display: block; font-size: 12px; color: #64748b; margin-bottom: 6px; }
    input, select {
      width: 100%; padding: 10px 12px; border-radius: 8px;
      border: 1px solid #e2e8f0; font-family: inherit; font-size: 14px;
      background: white;
    }
    .muted { color: #64748b; font-size: 13px; }
    .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
    th { color: #64748b; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
    .right { text-align: right; }
    .error { color: #dc2626; font-size: 13px; }
    .success { color: #16a34a; font-size: 13px; }
    .pill { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .pill.pending { background: #fef3c7; color: #92400e; }
    .pill.approved { background: #dbeafe; color: #1d4ed8; }
    .pill.processed { background: #e0e7ff; color: #3730a3; }
    .pill.paid { background: #dcfce7; color: #166534; }
  </style>
</head>
<body data-role="admin">
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1>Payroll</h1>
        <p>Configure payroll settings, calculate monthly payroll, and manage payroll periods.</p>
      </div>
      <div class="actions">
        <button class="btn" id="backBtn" type="button">Back</button>
        <button class="btn btn-danger" id="logoutBtn" type="button">Sign Out</button>
      </div>
    </div>

    <div class="card">
      <h2>Payroll Settings</h2>
      <p class="muted" style="margin-bottom: 12px;">Each employee must have payroll settings before monthly payroll can be calculated.</p>
      <div class="grid" style="margin-bottom: 12px;">
        <div>
          <label for="employeeSelect">Employee</label>
          <select id="employeeSelect"></select>
        </div>
        <div>
          <label for="baseSalary">Base salary</label>
          <input id="baseSalary" type="number" min="0" step="0.01" placeholder="e.g. 1200" />
        </div>
        <div>
          <label for="housingAllowance">Housing allowance</label>
          <input id="housingAllowance" type="number" min="0" step="0.01" placeholder="0" />
        </div>
        <div>
          <label for="transportAllowance">Transport allowance</label>
          <input id="transportAllowance" type="number" min="0" step="0.01" placeholder="0" />
        </div>
        <div>
          <label for="otherAllowances">Other allowances</label>
          <input id="otherAllowances" type="number" min="0" step="0.01" placeholder="0" />
        </div>
        <div>
          <label for="dedAbsent">Deduction / absent day</label>
          <input id="dedAbsent" type="number" min="0" step="0.01" placeholder="0" />
        </div>
        <div>
          <label for="dedLate">Deduction / late day</label>
          <input id="dedLate" type="number" min="0" step="0.01" placeholder="0" />
        </div>
        <div>
          <label for="dedHalfDay">Deduction / half-day</label>
          <input id="dedHalfDay" type="number" min="0" step="0.01" placeholder="0" />
        </div>
      </div>
      <div class="row">
        <button class="btn btn-primary" id="saveSettingsBtn" type="button">Save Settings</button>
        <span id="settingsMsg" class="muted"></span>
      </div>
    </div>

    <div class="card">
      <h2>Calculate Monthly Payroll</h2>
      <div class="row" style="margin-bottom: 12px;">
        <div style="min-width: 160px;">
          <label for="monthSelect">Month</label>
          <select id="monthSelect"></select>
        </div>
        <div style="min-width: 140px;">
          <label for="yearInput">Year</label>
          <input id="yearInput" type="number" min="2000" step="1" />
        </div>
        <div style="padding-top: 18px;">
          <button class="btn btn-primary" id="previewPayrollBtn" type="button">Preview</button>
        </div>
        <div style="padding-top: 18px;">
          <button class="btn" id="savePayrollBtn" type="button" disabled>Save Payroll</button>
        </div>
      </div>
      <div id="payrollSummaryMsg" class="muted" style="margin-bottom: 10px;"></div>
      <div id="payrollTableWrap">
        <p class="muted">No preview yet.</p>
      </div>
    </div>

    <div class="card">
      <h2>Payroll Period</h2>
      <div class="row" style="margin-bottom: 10px;">
        <div style="min-width: 160px;">
          <label for="periodMonthSelect">Month</label>
          <select id="periodMonthSelect"></select>
        </div>
        <div style="min-width: 140px;">
          <label for="periodYearInput">Year</label>
          <input id="periodYearInput" type="number" min="2000" step="1" />
        </div>
        <div style="padding-top: 18px;">
          <button class="btn" id="loadPeriodBtn" type="button">Load</button>
        </div>
        <div style="padding-top: 18px;">
          <button class="btn btn-danger" id="deletePeriodBtn" type="button">Delete Period</button>
        </div>
      </div>
      <div id="periodMsg" class="muted" style="margin-bottom: 10px;"></div>
      <div id="periodTableWrap">
        <p class="muted">No period loaded.</p>
      </div>
    </div>
  </div>

  <script src="/js/payroll.js"></script>
</body>
</html>
