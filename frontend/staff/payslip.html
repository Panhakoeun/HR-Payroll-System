<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Payslips - Staff - HRPayroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', sans-serif;
      background: #f8fafc;
      color: #0f172a;
      min-height: 100vh;
      padding: 24px 16px;
    }
    .container { max-width: 1000px; margin: 0 auto; }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 16px;
    }
    .header-left h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 4px; }
    .header-left p { color: #64748b; font-size: 14px; }
    .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn {
      padding: 10px 14px; border-radius: 8px; border: 1px solid #e2e8f0;
      background: white; cursor: pointer; font-weight: 600; font-family: inherit;
    }
    .btn-primary { background: #2563eb; border-color: #2563eb; color: white; }
    .btn-danger { background: #ef4444; border-color: #ef4444; color: white; }
    .card {
      background: white; border: 1px solid #e2e8f0; border-radius: 12px;
      padding: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 10px; border-bottom: 1px solid #e2e8f0; font-size: 13px; }
    th { color: #64748b; font-weight: 700; font-size: 12px; text-transform: uppercase; letter-spacing: 0.4px; }
    .right { text-align: right; }
    .muted { color: #64748b; font-size: 13px; }
    .pill { padding: 4px 8px; border-radius: 999px; font-size: 12px; font-weight: 700; }
    .pill.draft { background: #e2e8f0; color: #334155; }
    .pill.generated { background: #dbeafe; color: #1d4ed8; }
    .pill.sent { background: #fef3c7; color: #92400e; }
    .pill.viewed { background: #dcfce7; color: #166534; }
    .link { color: #2563eb; cursor: pointer; font-weight: 700; }
    .error { color: #dc2626; font-size: 13px; }
  </style>
</head>
<body data-role="staff">
  <div class="container">
    <div class="header">
      <div class="header-left">
        <h1>Payslips</h1>
        <p>View your payslips and mark them as viewed.</p>
      </div>
      <div class="actions">
        <button class="btn" id="backBtn" type="button">Back</button>
        <button class="btn btn-danger" id="logoutBtn" type="button">Sign Out</button>
      </div>
    </div>

    <div class="card">
      <div style="display:flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px;">
        <div>
          <div class="muted">Tip: Click a payslip row to mark it as viewed.</div>
        </div>
        <div class="actions">
          <button class="btn" id="refreshBtn" type="button">Refresh</button>
        </div>
      </div>
      <div id="msg" class="muted" style="margin-bottom: 10px;"></div>
      <div id="tableWrap">
        <p class="muted">Loading...</p>
      </div>
    </div>
  </div>

  <script src="/js/payslip.js"></script>
</body>
</html>
