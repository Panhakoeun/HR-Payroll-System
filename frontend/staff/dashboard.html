<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Staff Dashboard - HRPayroll</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; font-family: Inter, sans-serif; background: #f6f8fb; color: #111827; }
    a, button { font: inherit; }
    .topbar { height: 76px; background: #fff; border-bottom: 1px solid #dbe3ef; display: flex; align-items: center; justify-content: space-between; padding: 0 32px; }
    .page { max-width: 1080px; margin: 0 auto; padding: 34px 24px 48px; display: grid; gap: 24px; }
    h1 { font-size: 32px; line-height: 1.1; font-weight: 800; }
    h2 { font-size: 18px; font-weight: 800; }
    .muted, .subtitle { color: #93a1ba; }
    .subtitle { font-weight: 600; margin-top: 8px; }
    .grid { display: grid; grid-template-columns: repeat(2, minmax(260px, 1fr)); gap: 18px; }
    .card { min-height: 168px; background: #fff; border: 1px solid #dbe3ef; border-radius: 8px; box-shadow: 0 4px 14px rgba(15, 23, 42, .08); padding: 24px; display: grid; align-content: space-between; gap: 18px; text-decoration: none; color: inherit; }
    .card strong { font-size: 20px; }
    .card span { color: #52627a; line-height: 1.5; }
    .btn { height: 42px; border: 1px solid #ef4444; border-radius: 8px; background: #fff; color: #ef4444; padding: 0 16px; font-weight: 800; cursor: pointer; }
    .card .btn { width: max-content; background: #2557f6; border-color: #2557f6; color: #fff; display: inline-flex; align-items: center; text-decoration: none; }
    @media (max-width: 760px) { .topbar { padding: 0 18px; } .grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-role="staff" data-page="home">
  <header class="topbar">
    <div>
      <h2>HRPayroll</h2>
      <p class="muted">Logged in as <strong id="userName">-</strong> · <span id="userRole">-</span></p>
    </div>
    <button class="btn" id="logoutButton" type="button">Sign Out</button>
  </header>
  <main class="page">
    <div>
      <h1>My Space</h1>
      <p class="subtitle">Open your attendance and leave tools.</p>
    </div>
    <div class="grid">
      <a class="card" href="/staff/attendanceTraking.html">
        <strong>My Attendance</strong>
        <span>View your monthly attendance summary and history.</span>
        <span class="btn">Open Attendance</span>
      </a>
      <a class="card" href="/staff/LeaveRequest.html">
        <strong>My Leave</strong>
        <span>Submit a leave request, track status, and cancel pending requests.</span>
        <span class="btn">Open Leave</span>
      </a>
    </div>
  </main>
  <script src="/js/dashboard.js"></script>
</body>
</html>
